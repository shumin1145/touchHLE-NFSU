name: Build NFSU APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 25.2.9519653
        run: |
          sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build p7zip-full

      - name: Install Gradle 8.11.1
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -O gradle.zip
          unzip -q gradle.zip
          sudo mv gradle-8.11.1 /opt/gradle
          echo "/opt/gradle/bin" >> "$GITHUB_PATH"

      - name: Create local.properties
        run: |
          cd android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Extract bundled IPA
        run: |
          cd android/app/src/main/assets/touchHLE_apps
          7z x "极品飞车12.ipa.7z.001"
          rm -f 极品飞车12.ipa.7z.*
          ls -lh

      - name: Download Boost headers
        run: |
          wget -q "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.gz" -O boost.tar.gz
          tar -xzf boost.tar.gz
          mkdir -p vendor/boost
          mv boost_1_84_0/boost vendor/boost/
          test -f vendor/boost/boost/version.hpp
          rm -rf boost_1_84_0 boost.tar.gz

      - name: Build Android APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}
          RUSTFLAGS: "-A warnings"
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFSU_Android_AArch64
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
